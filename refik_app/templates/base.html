{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
    <title>Refik, Keşif & İnşa</title>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'home' %}">Refik, Keşif & İnşa</a>

            <div class="collapse navbar-collapse" id="navbarNav">
                {% if user.is_authenticated %}
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'hadis.list' %}">Hadisler</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'music.list' %}">Müzikler</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Şiirler</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Tiyatrolar</a>
                        </li>
                    </ul>
                {% endif %}
                <ul class="navbar-nav ml-auto">
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'logout' %}"><i class="fa-solid fa-arrow-right-from-bracket"> Git</i></a>
                        </li>
                    {% else %}
                        <div class="container d-flex flex-row">
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'login' %}"><i class="fa-solid fa-arrow-right-to-bracket"> Giris</i></a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#"><i class="fa-solid fa-plus"> Kayıt Ol</i></a>
                            </li>
                        </div>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <div class="my-5 align-items-start container justify-align-items-center">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://kit.fontawesome.com/369b677349.js" crossorigin="anonymous"></script>
   </body>
</html>
